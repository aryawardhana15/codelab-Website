services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: codelab-db
    restart: always
    environment:
      POSTGRES_USER: codelab_user
      POSTGRES_PASSWORD: CodelabSecure123
      POSTGRES_DB: codelab_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - codelab-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codelab_user -d codelab_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Express.js Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codelab-backend
    restart: always
    environment:
      PORT: "5000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: codelab_user
      DB_PASSWORD: CodelabSecure123
      DB_NAME: codelab_db
      JWT_SECRET: codelab-jwt-secret-key-2026
      JWT_EXPIRES_IN: 7d
      GROQ_API_KEY: YOUR_GROQ_API_KEY_HERE
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - codelab-network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://srv1293734.hstgr.cloud/api
    container_name: codelab-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://srv1293734.hstgr.cloud/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - codelab-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: codelab-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - codelab-network

volumes:
  postgres_data:

networks:
  codelab-network:
    driver: bridge
